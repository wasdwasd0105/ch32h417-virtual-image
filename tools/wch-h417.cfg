# OpenOCD config for CH32H417 via WCH-LinkE (single-wire SDI), used by tools/flash.sh.
# Same as the MounRiver wch-riscv.cfg but with the work area placed in the
# CH32H417 SRAM (0x20100000) so flash verification runs at full speed.
adapter driver wlinke
adapter speed 4000   ;# 6000 was marginal for the flash algorithm on this WCH-LinkE: writes corrupted
transport select sdi

wlink_set_address 0x00000000
set _CHIPNAME wch_riscv
sdi newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x00001

set _TARGETNAME $_CHIPNAME.cpu

target create $_TARGETNAME.0 wch_riscv -chain-position $_TARGETNAME
$_TARGETNAME.0 configure -work-area-phys 0x20100000 -work-area-size 0x4000 -work-area-backup 1
set _FLASHNAME $_CHIPNAME.flash

flash bank $_FLASHNAME wch_riscv 0x00000000 0 0 0 $_TARGETNAME.0

echo "Ready for Remote Connections"
